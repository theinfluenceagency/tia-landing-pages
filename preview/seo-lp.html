<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SEO LP preview shell (mimics the Webflow page)</title>
<style>body{margin:0;background:#F7F7F7}</style>
</head>
<body>
<!-- React mounts here (this is the HTML Embed on the Webflow page) -->
<div id="tia-lp-root" data-lp="seo"></div>

<!-- Native Webflow Form Block, exactly as Webflow renders it. Parked off-screen until adopted. -->
<div id="tia-form-shell" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden">
  <div class="w-form">
    <form id="wf-form-SEO-LP-Quote-Form" name="wf-form-SEO-LP-Quote-Form" data-name="Email Form" method="get" redirect="/seo-lp-thank-you" data-redirect="/seo-lp-thank-you">
      <label for="Website-URL">Website URL</label>
      <input class="w-input" maxlength="256" name="field" placeholder="Example Text" type="text" id="Website-URL" required>
      <label for="Name">Name</label>
      <input class="w-input" maxlength="256" name="name" type="text" id="Name" required>
      <label for="Email">Work email</label>
      <input class="w-input" maxlength="256" name="email" type="email" id="Email" required>
      <label for="Business-Name">Business name</label>
      <input class="w-input" maxlength="256" name="field-2" placeholder="Example Text" type="text" id="Business-Name" required>
      <label for="Phone">Phone <span class="opt">(optional)</span></label>
      <input class="w-input" maxlength="256" name="field-3" placeholder="Example Text" type="tel" id="Phone">
      <label for="Tier">Which tier fits your goals <span class="opt">(optional)</span></label>
      <select id="Tier" name="field-4" class="w-select"><option value="">Select one...</option><option value="First">First choice</option></select>
      <label for="Message">Anything we should know? <span class="opt">(optional)</span></label>
      <textarea id="Message" name="field-5" placeholder="Example Text" maxlength="5000" class="w-input"></textarea>
      <label for="middle_name">Leave this blank</label>
      <input class="w-input" name="field-6" placeholder="Example Text" type="text" id="middle_name" tabindex="-1" autocomplete="off">
      <input type="submit" class="w-button" value="Get my proposal →">
    </form>
    <div class="w-form-done"><div>Thank you! Your submission has been received!</div></div>
    <div class="w-form-fail"><div>Oops! Something went wrong while submitting the form.</div></div>
  </div>
</div>

<script type="module" src="/seo-lp.js"></script>
</body>
</html>
